name: build dcsswiftbus

on:
  push:
    branches: ["Master", "claude/vatsim-dcs-swift-client-bm5u5c"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-dbus
            mingw-w64-x86_64-libevent

      - name: Build and package
        run: |
          cd dcsswiftbus
          ./tools/package.sh
          cd dist
          zip -r dcsswiftbus-win64.zip dcsswiftbus

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcsswiftbus-win64
          path: dcsswiftbus/dist/dcsswiftbus/

      - name: Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dcsswiftbus/dist/dcsswiftbus-win64.zip
          generate_release_notes: true

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libdbus-1-dev libevent-dev
      - name: Build
        run: cd dcsswiftbus && cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - name: End-to-end protocol test
        run: cd dcsswiftbus && ./test/run_poc.sh
