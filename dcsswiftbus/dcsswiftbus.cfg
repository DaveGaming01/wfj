# dcsswiftbus settings. Lines starting with # are comments.
# Command-line options override anything set here.

# Who owns COM1/COM2 and the squawk code:
#   cockpit = the radios you tune in the DCS cockpit (needs DCS-SRS installed;
#             falls back to the swift GUI automatically when no cockpit data)
#   swift   = always tune radios and squawk in the swift GUI
radios = cockpit

# Where swift connects (swift FlightGear plugin: DBus P2P, same host & port)
dbus_host = 127.0.0.1
dbus_port = 45003

# UDP port the dcsswiftbus Export.lua sends position data to
dcs_port = 47788

# UDP port the DCS-SRS export script broadcasts cockpit radios on
srs_port = 9084
